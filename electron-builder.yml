appId: com.chatonsteroids.app
productName: Chat On Steroids
copyright: MIT licensed

directories:
  output: release
  buildResources: build

# Only the built output ships. Source, tests and dev config stay out of the asar.
files:
  - out/**
  - package.json
  # npm installs only the host Sharp platform package. packaging:prepare stages both,
  # then exclude both platform packages from dependency collection and add only the target.
  - '!node_modules/@img/sharp-win32-*/**/*'
  - node_modules/@img/sharp-win32-${arch}/**/*

# Runtime resources ship outside the asar because they must exist as real files on disk:
#   · tunnel-client (Apache-2.0), fetched at build time by scripts/fetch-tunnel-client.mjs,
#     because it has to be executable
#   · the Chrome extension, because chrome://extensions → Load unpacked reads a folder,
#     and Chrome cannot see inside an asar. Without this the installed app would tell
#     users to load a folder that is not on their machine.
#   · ripgrep, because coding/search commands execute rg.exe directly.
# The app opens resources/extension from its own Chrome extension settings, so this
# path is not merely documentation — extension-path.ts depends on it.
extraResources:
  - from: LICENSE
    to: LICENSE
  # Preserve the upstream Sharp Windows package's third-party/libvips licensing table.
  - from: node_modules/@img/sharp-win32-${arch}/README.md
    to: THIRD-PARTY-NOTICES-sharp-win32-${arch}.md
  - from: resources/packaging/tunnel/${arch}
    to: tunnel
    filter:
      - '**/*'
  - from: extension
    to: extension
    filter:
      - '**/*'
      - '!**/*.map'
  - from: resources/packaging/rg/${arch}
    to: rg
    filter:
      - '**/*'

# The native packages all ship Windows prebuilds. Rebuilding would require Visual Studio
# build tools and would replace the exact artifacts validated by the packaging smoke test.
npmRebuild: false

# Keep native dependency trees on the real filesystem. node-pty needs ConPTY assets by path,
# Sharp loads its .node binding + libvips DLLs, and tree-sitter loads grammar addons.
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/tree-sitter/**'
  - '**/node_modules/tree-sitter-bash/**'
compression: maximum

win:
  target: nsis
  icon: build/icon.ico
  # The app itself always runs as the current user. The assisted installer defaults to
  # current-user installation; its optional all-users mode may require elevation.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  # GitHub releases publish one explicit installer per CPU architecture.
  buildUniversalInstaller: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chat On Steroids
  artifactName: Chat-On-Steroids-Setup-${arch}.${ext}
  uninstallDisplayName: Chat On Steroids
  # Settings and the encrypted API key live in %APPDATA%\chat-on-steroids and must
  # outlive an uninstall, so reinstalling or updating never asks for them again.
  # This is the default; it is written down because losing it would be silent.
  deleteAppDataOnUninstall: false
