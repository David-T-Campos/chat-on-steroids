name: Apply loop fidelity refinements

on:
  push:
    branches: [feature/loop-mode]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loop-fidelity]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/loop-mode
      - name: Retarget current iteration prompt indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-loop-fidelity.py')
          text = p.read_text()
          needle = "replace('src/main/loop.ts', old_body, new_body)"
          replacement = '''old_prefix, old_sep, old_tail = old_body.rpartition("  return [")
          old_body = old_prefix + old_sep + old_tail.replace("\\n      ", "\\n    ")
          new_prefix, new_sep, new_tail = new_body.rpartition("  return [")
          new_body = new_prefix + new_sep + new_tail.replace("\\n      ", "\\n    ")
          replace('src/main/loop.ts', old_body, new_body)'''
          if needle not in text:
              raise SystemExit('iteration prompt patch anchor missing')
          p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Apply refinements
        run: python3 scripts/apply-loop-fidelity.py
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src extension test docs
          git commit -m "feat: align loop refresh and cancellation semantics [loop-fidelity]"
          git push origin HEAD:feature/loop-mode
