name: Apply loop behavior fixes

on:
  push:
    branches: [feature/loop-mode]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loop-behavior-fixes]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/loop-mode
      - name: Apply fixes
        run: python3 scripts/apply-loop-fixes.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src extension test docs
          git commit -m "fix: harden loop pacing and capability boundaries [loop-behavior-fixes]"
          git push origin HEAD:feature/loop-mode
