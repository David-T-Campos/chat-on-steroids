name: Apply loop fix

on:
  push:
    branches: [feature/loop-mode]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loop-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/loop-mode
      - name: Make regex captures explicit under noUncheckedIndexedAccess
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/loop.ts')
          text = p.read_text()
          text = text.replace('Number.parseInt(leading[1], 10)', "Number.parseInt(leading[1] ?? '', 10)")
          text = text.replace('compactUnit(leading[2])', "compactUnit(leading[2] ?? '')")
          text = text.replace('Number.parseInt(trailing[1], 10)', "Number.parseInt(trailing[1] ?? '', 10)")
          text = text.replace('compactUnit(trailing[2])', "compactUnit(trailing[2] ?? '')")
          p.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/loop.ts
          git commit -m "fix: make loop parser captures type-safe [loop-fix]"
          git push origin HEAD:feature/loop-mode
