name: Apply loop integration

on:
  push:
    branches: [feature/loop-mode]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loop-integrated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/loop-mode
      - name: Retarget current source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-loop-integration.py')
          text = p.read_text()
          text = text.replace(
              '"  /** Sends the current composer text, after verifying ChatGPT accepted it. */",',
              '"  async function send() {",'
          )
          text = text.replace(
              '  /** Sends the current composer text, after verifying ChatGPT accepted it. */\'\'\'',
              '  async function send() {\'\'\''
          )
          text = text.replace(
              "['read', 'view_image', 'apply_patch', 'exec_command', 'write_stdin', 'session', 'agents']",
              "['agents', 'apply_patch', 'exec_command', 'read', 'session', 'view_image', 'write_stdin']",
              1
          )
          text = text.replace(
              "['read', 'view_image', 'apply_patch', 'exec_command', 'write_stdin', 'loop', 'session', 'agents']",
              "['agents', 'apply_patch', 'exec_command', 'loop', 'read', 'session', 'view_image', 'write_stdin']",
              1
          )
          text = text.replace(
              'text = p.read_text().replace("toBeLessThanOrEqual(7)", "toBeLessThanOrEqual(8)")',
              'text = p.read_text().replace("toBeLessThanOrEqual(7)", "toBeLessThanOrEqual(8)").replace("toHaveLength(7)", "toHaveLength(8)").replace("capped at seven live schemas", "capped at eight live schemas")'
          )
          p.write_text(text)
          PY
      - name: Patch integration points
        run: python3 scripts/apply-loop-integration.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src extension test docs
          git commit -m "feat: integrate first-class /loop mode [loop-integrated]"
          git push origin HEAD:feature/loop-mode
