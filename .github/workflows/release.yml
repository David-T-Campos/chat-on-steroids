name: Release candidate

# A tag on its own no longer builds. Publishing builds, so the installers a release
# carries are produced from the tag being published, inside the run that publishes it,
# and never travel between runs. `workflow_dispatch` still produces an unpublished
# candidate from any ref when you want the proof without the release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Verify
        run: npm run verify:ci

      - name: Prove native runner architecture
        shell: pwsh
        run: |
          $expected = '${{ matrix.arch }}'
          $actual = node -p "process.arch"
          if ($actual -ne $expected) { throw "Expected $expected runner, got $actual" }

      - name: Package Windows installer
        run: npm run dist:${{ matrix.arch }}

      - name: Smoke packaged runtime natively
        shell: pwsh
        run: |
          $roots = @(Get-ChildItem release -Directory | Where-Object Name -Like 'win*-unpacked')
          if ($roots.Count -ne 1) {
            throw "Expected one unpacked ${{ matrix.arch }} build, found $($roots.Count)"
          }
          node scripts/smoke-packaged-runtime.mjs $roots[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check installer name
        shell: pwsh
        run: |
          $expected = "Chat-On-Steroids-Setup-${{ matrix.arch }}.exe"
          if (-not (Test-Path -LiteralPath "release/$expected")) {
            throw "Missing release/$expected"
          }

      - name: Upload ${{ matrix.arch }} installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.arch }}
          path: release/Chat-On-Steroids-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release candidate
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Package standalone extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension\*, LICENSE -DestinationPath release\Chat-On-Steroids-Extension.zip -CompressionLevel Optimal
          $manifest = Get-Content extension\manifest.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $package.version) {
            throw "Extension $($manifest.version) does not match app $($package.version)"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path release\Chat-On-Steroids-Extension.zip))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            $requiredEntries = @(
              'manifest.json',
              'LICENSE',
              'background.js',
              'chatgpt-dom.js',
              'content.js',
              'fiber.js',
              'overlay.css',
              'popup.html',
              'popup.css',
              'popup.js',
              'icons/icon16.png',
              'icons/icon32.png',
              'icons/icon48.png',
              'icons/icon128.png'
            )
            foreach ($required in $requiredEntries) {
              if ($entries -notcontains $required) { throw "Standalone extension zip is missing $required at its root" }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            'release/Chat-On-Steroids-Setup-x64.exe',
            'release/Chat-On-Steroids-Setup-arm64.exe',
            'release/Chat-On-Steroids-Extension.zip'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" }
          }
          $lines = foreach ($file in $files) {
            $item = Get-Item -LiteralPath $file
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
          Get-Content release/SHA256SUMS.txt

      # Publishing a GitHub Release stays a deliberate maintainer action: this workflow
      # only produces a verified, checksummed candidate. publish.yml calls it and is the
      # only thing that turns the result into a release.
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-on-steroids-${{ github.ref_name }}
          path: |
            release/Chat-On-Steroids-Setup-x64.exe
            release/Chat-On-Steroids-Setup-arm64.exe
            release/Chat-On-Steroids-Extension.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
